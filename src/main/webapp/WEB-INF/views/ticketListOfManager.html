<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Tickets</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.0/jquery-ui.min.js"></script>
    <link th:href="@{/css/ticketListOfManager.css}" rel="stylesheet">

</head>

<body>

<h1>Tickets</h1>
<div class="centered-text">Sorted</div>

<form th:action="@{/ticketListOfManager}" th:method="GET">
    <select name="var">
        <option value="urgency">urgency</option>
        <option value="id">id</option>
        <option value="id decreasing">id decreasing</option>
        <option value="date">date</option>
        <option value="creationDate">date of creation</option>
        <option value="alphabet">alphabet</option>
        <option value="state">state</option>
        <option value="APPROVED">APPROVED</option>
        <option value="CANCELED">CANCELED</option>
    </select>
    <input type="submit" value="filter" />
</form>

<div id="header" class="link-container">
    <a th:href="@{/create_ticket}">Create new ticket</a>
    <a th:href="@{/logout}" class="logout-link">Press here if you want logout</a>
</div>

<div id="tabs">
    <ul>
        <li><a href="#tab1">NEW <span th:text="${newTicked.size()}"></span></a></li>
        <li><a href="#tab2">IN PROGRESS <span th:text="${inPogressTicked.size()}"></span></a></li>
        <li><a href="#tab4">DONE <span th:text="${doneTicked.size()}"></span></a></li>
    </ul>

    <!-- NEW -->
    <div id="tab1">
        <div class="container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Urgency</th>
                    <th>State</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="lis:${newTicked}">
                    <td>
                        <form th:action="@{/tickedShow/{id}(id=${lis.getId()})}" method="POST">
                            <button type="submit" th:text="${lis.getId()}"></button>
                        </form>
                    </td>
                    <td><a th:text="${lis.getName()}"></a></td>
                    <td><a th:text="${lis.getDescription()}"></a></td>
                    <td><a th:text="${lis.getUrgency()}"></a></td>
                    <td><a th:text="${lis.getState()}"></a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- IN PROGRESS -->
    <div id="tab2">
        <div class="container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Urgency</th>
                    <th>State</th>
                    <th>For approval</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="lis:${inPogressTicked}">
                    <td>
                        <form th:action="@{/tickedShow/{id}(id=${lis.getId()})}" method="POST">
                            <button type="submit" th:text="${lis.getId()}"></button>
                        </form>
                    </td>
                    <td><a th:text="${lis.getName()}"></a></td>
                    <td><a th:text="${lis.getDescription()}"></a></td>
                    <td><a th:text="${lis.getUrgency()}"></a></td>
                    <td><a th:text="${lis.getState()}"></a></td>
                    <td>
                        <div th:if="${lis.getApproving() != null}">
                            <a>for approval</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- DONE -->
    <div id="tab4">
        <div class="container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Urgency</th>
                    <th>State</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="lis:${doneTicked}">
                    <td>
                        <form th:action="@{/tickedShow/{id}(id=${lis.getId()})}" method="POST">
                            <button type="submit" th:text="${lis.getId()}"></button>
                        </form>
                    </td>
                    <td><a th:text="${lis.getName()}"></a></td>
                    <td><a th:text="${lis.getDescription()}"></a></td>
                    <td><a th:text="${lis.getUrgency()}"></a></td>
                    <td><a th:text="${lis.getState()}"></a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    $(function () {
      $("#tabs").tabs();
    });
</script>

</body>
</html>
